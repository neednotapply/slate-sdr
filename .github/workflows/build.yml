name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the full source build with Wi-Fi spectral scan (1-3 hours)"
        type: boolean
        default: false

jobs:
  quick:
    name: Firmware (SDK + ImageBuilder) and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          pip install --quiet shellcheck-py
          cd feed/utils/slate-sdr/files
          shellcheck -s sh -e SC1091,SC3043 -x job.sh slate-sdr.cli status.cgi slate-sdr.defaults
          shellcheck -s sh -e SC3043,SC2034 lib.sh
          shellcheck -s sh -e SC1091,SC2034,SC3043,SC2154 slate-sdr.init
          cd "$GITHUB_WORKSPACE"
          shellcheck -s sh build.sh build-full.sh scripts/*.sh tests/run.sh
          shellcheck -s sh -e SC3043,SC2016,SC2012,SC1091,SC2015 tests/rootfs-test.sh

      - name: Build
        run: ./build.sh

      - name: Test on OpenWrt's MIPS userland (QEMU)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          sh tests/run.sh out/packages

      - uses: actions/upload-artifact@v4
        with:
          name: slate-sdr-firmware
          path: |
            out/firmware/*sysupgrade.bin
            out/firmware/*.manifest
            out/firmware/sha256sums
            out/packages/*.apk

  full:
    name: Firmware with Wi-Fi spectral scan (full source build)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc

      - name: Build
        run: ./build-full.sh

      - uses: actions/upload-artifact@v4
        with:
          name: slate-sdr-firmware-full
          path: out/firmware-full/
